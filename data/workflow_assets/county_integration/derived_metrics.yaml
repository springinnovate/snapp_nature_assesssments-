# County totals and ratios for the CSV and GeoPackage exports.
# Source paths are relative to --data-root.
schema_version: 1

es_total:
  # Sum these adjusted service totals. Annual flood value is included;
  # flood NPV is kept as a separate output field, outside this total.
  components:
    - sum_flood_annual_value_masked_to_wetlands_adj
    - sum_avoided_dredging_costs_raster_adj
    - sum_avoided_sdwa_health_costs_raster_adj
    - sum_avoided_treatment_costs_raster_adj
    - sum_mental_health_national_existing_greenness_cost_90m_adj
    - sum_pollination_attributed_annual_crop_yield_value_adj
    - sum_CO2e_mitigation_dollar_value_per_pixel_adj
    - sum_Wval_sw_2020usd_total_adj
    - sum_aeb_coral_BC_USD11_adj
    - sum_mangrove_coastal_flood_protection_value_adj
    - air_quality_avoided_mortality_annual_value_adj
    - grazing_adj
    - jobs_adj
    - timber_adj
    - marine_fisheries_adj
    - inland_fisheries_adj
    - recreation_adj
    - urban_heat_adj
    - physical_health_adj
  blank_value: 0.0
  interpretation: >-
    Sum of 19 adjusted service values, with annual flood benefits included and
    flood NPV excluded. Interpret as an assessment summary: the components
    include annual benefits, wages and carbon-stock valuation with differing
    time bases and possible economic overlap.

sources:
  county_area:
    path: analysis_inputs/boundaries/county_reporting_areas/tl_2024_us_county_excl_ocean_great_lakes.csv
    encoding: utf-8-sig
    key: GEOID
    field: area_ha_county_excl_ocean_great_lakes
    output: area_ha_county
    scale: 1.0
    require_all_counties: true
  county_area_inclusive:
    # Full and excluded areas use the same county polygons and projection.
    path: analysis_inputs/boundaries/county_reporting_areas/tl_2024_us_county_excl_ocean_great_lakes_qa.csv
    encoding: utf-8-sig
    key: GEOID
    field: area_ha_full_county
    output: area_ha_county_incl_ocean_great_lakes
    scale: 1.0
    require_all_counties: true
  natural_areas:
    # Five NLCD masks measured on the same ocean/Great-Lakes-excluded footprint.
    path: analysis_inputs/boundaries/county_reporting_areas/tl_2024_us_county_excl_ocean_great_lakes.gpkg
    layer: county_reporting_areas
    key: GEOID
    county_area_field: area_ha_county_excl_ocean_great_lakes
  natural_areas_inclusive:
    # The same five NLCD classes measured on the uncut county footprints.
    path: analysis_results/nlcd_mask_areas/2026_10_26_15_03_29_853049/counties_nlcd_mask_areas_2026_10_26_15_03_29_853049.gpkg
    layer: tl_2024_us_county_50_states
    key: GEOID
    field: area_ha_all_natural
    output: area_ha_all_natural_incl_ocean_great_lakes
  gdp:
    path: analysis_inputs/CAGDP1_LineCode3_All_States.csv
    encoding: utf-8-sig
    key: GeoFIPS
    field: '2024'
    output: GDP_2024
    where: {LineCode: '3'}
    units: Thousands of dollars
    scale: 1000.0
    missing_tokens: ['(NA)', '(D)']
    exclude_state_totals: true
    require_all_counties: false
    allocation_crosswalk: workflow_assets/county_integration/virginia_gdp_crosswalk.csv
  population:
    path: analysis_inputs/co-est2025-alldata.csv
    encoding: cp1252
    key: GEOFIPS
    field: POPESTIMATE2024
    output: Pop_2024
    where: {SUMLEV: '050'}
    scale: 1.0
    require_all_counties: false

# Divide es_total by each denominator.
ratios:
  es_per_ha: area_ha_county
  es_per_ha_incl_ocean_great_lakes: area_ha_county_incl_ocean_great_lakes
  es_per_ha_natural: area_ha_all_natural
  es_per_ha_natural_incl_ocean_great_lakes: area_ha_all_natural_incl_ocean_great_lakes
  es_per_gdp: GDP_2024
  es_per_capita: Pop_2024

# CONUS county summaries only. Numerators remain land-only footprint hectares.
# Unsuffixed fields exclude ocean and Great Lakes; inclusive companions follow.
county_footprint_ratios:
  denominators:
    '': area_ha_county
    _incl_ocean_great_lakes: area_ha_county_incl_ocean_great_lakes
  numerators:
    ratio_public_lands_to_county_area: area_ha_public_lands
    ratio_conservation_lands_to_county_area: area_ha_conservation_lands
    ratio_bbb_lands_to_county_area: area_ha_bbb_lands

# County-only value shares: each product's total_ecosystem_services divided
# by the matching county's total_ecosystem_services, excluding recreation.
# Use county unions, not the potentially overlapping manager-type products.
county_ecosystem_service_ratios:
  ratio_public_lands_es_value_to_county_es_value: public_lands_by_county
  ratio_conservation_lands_es_value_to_county_es_value: conservation_lands_by_county
  ratio_bbb_lands_es_value_to_county_es_value: bbb_lands_by_county

# USD per footprint land hectare: the category's own total_ecosystem_services
# divided by its area_ha_land. Recreation is excluded. Missing values and
# nonpositive land hectares produce blanks.
# Publish a copy in the county output, matched by GEOID.
county_land_service_value_per_ha:
  public_lands_counties_total_es_value_per_land_ha: public_lands_by_county
  conservation_lands_counties_total_es_value_per_land_ha: conservation_lands_by_county
  bbb_lands_counties_total_es_value_per_land_ha: bbb_lands_by_county

# Publish the same density in the corresponding by-county footprint product.
footprint_land_service_value_per_ha:
  total_public_es_value_per_public_land_ha: public_lands_by_county
  total_conservation_es_value_per_conservation_land_ha: conservation_lands_by_county
  total_bbb_es_value_per_bbb_land_ha: bbb_lands_by_county
